name: Sugerir uma melhoria / Feature request
description: Ideia ou necessidade nova / A new idea or need
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema ou necessidade / Problem or need
      description: O que você não consegue fazer hoje? / What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta / Proposal
      description: Como imagina que funcionaria? / How do you imagine it working?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas / Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Área / Area
      description: Onde o recurso atua. / Where the feature applies.
      options:
        - Tipo de campo (perfil ou personalizado) / Field type (profile or custom)
        - Área de campos personalizados (categoria, competência, emblema...) / Custom field area (category, competency, badge...)
        - Plugin comum (local_fieldssuite) / Common plugin (local_fieldssuite)
        - Outro / Other
    validations:
      required: true
